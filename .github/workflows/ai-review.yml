name: ai-review

# On demand only, it's billed: the `ai-review` label, or a `/ai-review` comment. Release PRs never get it.
on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  review:
    uses: mathieuletyrant/ai-pr-review/.github/workflows/review.yml@v1
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
