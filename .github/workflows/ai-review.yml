name: ai-review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]
  issue_comment:
    types: [created]

jobs:
  review:
    uses: mathieuletyrant/ai-pr-review/.github/workflows/review.yml@v1
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
