# Builds the OpenAPI generator (apps/ios/Tools) into a cache on main, where every branch's ios-client job can read it: a branch's own cache isn't shared,
# and an unused one expires after 7 days, hence the weekly run.
name: swift-tools

on:
  push:
    branches: [main]
    paths: ["apps/ios/Tools/**"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: apps/ios/Tools/.build
          key: swift-tools-${{ runner.os }}-${{ hashFiles('apps/ios/Tools/Package.resolved') }}
      - run: |
          swift build --package-path apps/ios/Tools -c release --product swift-openapi-generator
