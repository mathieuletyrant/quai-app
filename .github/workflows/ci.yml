name: ci

on:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: typescript
    strategy:
      matrix:
        target: [cloud, home]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: quai-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'apps/ios/**'
              - 'packages/api/**'

  # macOS minutes are billed: only when the app or the contract changes.
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - working-directory: apps/ios
        run: xcodegen generate
      # Runner images don't always ship the same simulators (some had none): use any available
      # iPhone, else create one, downloading the iOS runtime if it's missing.
      - name: Pick a simulator
        id: simulator
        run: |
          pick() { xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid // empty'; }
          udid=$(pick)
          if [ -z "$udid" ]; then
            runtime=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == "iOS")] | last | .identifier // empty')
            if [ -z "$runtime" ]; then
              xcodebuild -downloadPlatform iOS
              runtime=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == "iOS")] | last | .identifier')
            fi
            type=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | startswith("iPhone"))] | last | .identifier')
            udid=$(xcrun simctl create "Quai CI" "$type" "$runtime")
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - working-directory: apps/ios
        run: >
          xcodebuild test -project Quai.xcodeproj -scheme Quai
          -destination 'id=${{ steps.simulator.outputs.udid }}'
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
