name: ci

on:
  pull_request:
  # An agent's branch gets the iOS build and screenshots before any PR.
  push:
    branches: ["claude/**"]
  workflow_dispatch:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: typescript
    strategy:
      matrix:
        target: [cloud, home]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: quai-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      pushes: ${{ steps.filter.outputs.pushes }}
      pr: ${{ steps.pr.outputs.open }}
    steps:
      - uses: actions/checkout@v4
      # A push to a branch with an open PR: its pull_request run does the macOS work.
      - name: Open PR of this branch
        id: pr
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq 'length > 0')" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'apps/ios/**'
              # The app's client is generated from openapi.json, kept up to date by the contract test:
              # the protocol to Quai Home and the console's own API don't reach it.
              - 'packages/api/openapi.json'
              - 'apps/cloud/test/preview.ts'
              - 'apps/cloud/test/fixtures/**'
              - '.github/scripts/ios-screenshots.sh'
              - '.github/scripts/pr-comment.sh'
              - '.github/workflows/ci.yml'
            pushes:
              - 'apps/cloud/src/flows/Activities.ts'
              - 'apps/cloud/src/flows/Engine.ts'
              - 'apps/cloud/src/flows/Targeting.ts'
              - 'apps/cloud/src/push/Notifier.ts'
              - 'apps/cloud/src/integrations/Hub.ts'
              - '.claude/skills/verify/live-activity-pushes/**'
              - '.github/scripts/pr-comment.sh'
              - '.github/workflows/ci.yml'

  # The verify skill's live-activity-pushes scenario: a TLA+ model of the order pushes reach the iPhone.
  live-activity-pushes:
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.pushes == 'true' && !(github.event_name == 'push' && needs.changes.outputs.pr == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/quai
          key: tla2tools-${{ hashFiles('.claude/skills/verify/live-activity-pushes/verify.sh') }}
      - name: Model-check
        id: model
        run: |
          set +e
          .claude/skills/verify/live-activity-pushes/verify.sh > model.txt 2>&1
          code=$?
          cat model.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Post the result
        if: always() && steps.model.outputs.code != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.model.outputs.code }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$CODE" in
            0) verdict="✅ every result as expected: the code as it is keeps every invariant, the design before the fix still fails (the check can fail)." ;;
            1) verdict="❌ a result changed (marked \`!!\`): read the counterexample below." ;;
            *) verdict="⚠️ TLC didn't run." ;;
          esac
          {
            echo "### 🔁 Live Activity pushes, model-checked (TLA+)"
            echo
            echo "$verdict at ${HEAD_SHA:0:7} · [run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) · [what it proves](https://github.com/${GITHUB_REPOSITORY}/blob/${HEAD_SHA}/.claude/skills/verify/live-activity-pushes/README.md)"
            echo
            echo '```'
            grep -v "^Picked up" model.txt
            echo '```'
          } > model.md
          cat model.md >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/pr-comment.sh "<!-- quai-live-activity-pushes -->" model.md ${{ github.event.pull_request.number }}

  # The app's client isn't committed: generated here, outside the Xcode build, and handed to the
  # ios job. The generator comes from the cache that swift-tools.yml keeps on main.
  ios-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: apps/ios/Tools/.build
          key: swift-tools-${{ runner.os }}-${{ hashFiles('apps/ios/Tools/Package.resolved') }}
      - run: apps/ios/scripts/gen-client.sh
      # The app's Swift against apps/ios/.swiftformat, on Linux: each change SwiftFormat would make
      # is an annotation on its line, and fails the job. `apps/ios/scripts/format.sh` applies them.
      - name: SwiftFormat
        run: apps/ios/scripts/format.sh --lint --reporter github-actions-log
      - uses: actions/upload-artifact@v4
        with:
          name: ios-client
          path: apps/ios/Quai/Generated
          retention-days: 3

  # macOS minutes are billed: only when the app, the contract or the preview changes.
  ios:
    needs: [changes, ios-client]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.ios == 'true' && !(github.event_name == 'push' && needs.changes.outputs.pr == 'true'))
    runs-on: macos-26
    timeout-minutes: 30
    # A newer commit of the same branch replaces a run still going.
    concurrency:
      group: ios-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env:
      # No coverage, no index, one architecture (the runners are Apple silicon): nothing the CI reads.
      # The system git: Xcode's own took 6 minutes to resolve the three packages.
      XCODE_FLAGS: >-
        -project Quai.xcodeproj -scheme Quai -configuration Debug -derivedDataPath build
        -scmProvider system -enableCodeCoverage NO
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Started now, ready by the tests: the screenshots are of the app paired to it.
      - name: Start the preview server
        run: pnpm --filter @quai/cloud preview > preview.log 2>&1 &
      # Before XcodeGen, which lists the sources it finds.
      - uses: actions/download-artifact@v4
        with:
          name: ios-client
          path: apps/ios/Quai/Generated
      - run: brew install xcodegen && (command -v xcbeautify || brew install xcbeautify)
      - working-directory: apps/ios
        run: xcodegen generate
      # Runner images don't always ship the same simulators (some had none): use any available
      # iPhone, else create one, downloading the iOS runtime if it's missing.
      - name: Pick a simulator
        id: simulator
        run: |
          pick() { xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid // empty'; }
          udid=$(pick)
          if [ -z "$udid" ]; then
            runtime=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == "iOS")] | last | .identifier // empty')
            if [ -z "$runtime" ]; then
              xcodebuild -downloadPlatform iOS
              runtime=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == "iOS")] | last | .identifier')
            fi
            type=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | startswith("iPhone"))] | last | .identifier')
            udid=$(xcrun simctl create "Quai CI" "$type" "$runtime")
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # A cold simulator takes about 5 minutes to boot, and xcodebuild starts nothing while one
      # boots: the boot starts once the compiler runs, so the two overlap. The compile errors come
      # as annotations on the files.
      - name: Build, and boot the simulator
        working-directory: apps/ios
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          eval xcodebuild build-for-testing $XCODE_FLAGS \
            -destination "'generic/platform=iOS Simulator'" ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO > build.log 2>&1 &
          build=$!
          until grep -qE '^(SwiftCompile|CompileSwift|SwiftDriver) ' build.log || ! kill -0 "$build" 2> /dev/null; do sleep 1; done
          echo "Booting the simulator at $(date -u +%T)"
          xcrun simctl boot "$UDID" > simulator-boot.log 2>&1 &
          status=0; wait "$build" || status=$?
          xcbeautify --renderer github-actions < build.log
          exit "$status"
      - name: Wait for the simulator and the preview server
        run: |
          xcrun simctl bootstatus ${{ steps.simulator.outputs.udid }} -b
          for i in $(seq 60); do curl -sf http://127.0.0.1:8787/api/health > /dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1
      # The unit tests and, with the preview server, the screenshots (QuaiTests/AppScreenshots.swift).
      - name: Tests and screenshots
        working-directory: apps/ios
        env:
          TEST_RUNNER_QUAI_PREVIEW_URL: http://127.0.0.1:8787
          TEST_RUNNER_QUAI_SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
        run: >
          set -o pipefail &&
          eval xcodebuild test-without-building $XCODE_FLAGS
          -destination "'id=${{ steps.simulator.outputs.udid }}'"
          -resultBundlePath ../../tests.xcresult
          | xcbeautify --renderer github-actions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: |
            screenshots
            preview.log
          if-no-files-found: ignore
      # A fork's PR has a read-only token: its screenshots stay in the artifact.
      - name: Post the screenshots
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/ios-screenshots.sh screenshots ${{ github.event.pull_request.number }}
