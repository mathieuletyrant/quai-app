# The demo home for App Review (deploy/cloudflare-demo, demo.quai.stream): deployed when main changes
# what it runs, checked on pull requests that touch it. No secret but Cloudflare's: no APNs key.
name: demo

on:
  push:
    branches: [main]
    paths:
      - "deploy/cloudflare-demo/**"
      - "apps/cloud/**"
      - "packages/api/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:
  pull_request:
    paths: ["deploy/cloudflare-demo/**", "apps/cloud/test/preview.ts", ".github/workflows/demo.yml"]

concurrency:
  group: demo-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare-demo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      - if: github.event_name == 'pull_request'
        name: The image builds
        working-directory: .
        run: docker build -f deploy/cloudflare-demo/Dockerfile .
      - if: github.event_name == 'pull_request'
        run: pnpm exec wrangler deploy --dry-run --containers-rollout=none
      - if: github.event_name != 'pull_request'
        name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
