# Conventional commits on main → release PR (version + CHANGELOG) → merge it → GitHub release + Docker image.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The release PR is opened and updated with GITHUB_TOKEN, which starts no pull_request run, and when the commits
      # pushed to main change nothing in its changelog, release-please leaves it alone: its branch keeps an older main.
      # So at each push to main, the open release PR's branch takes main in (a merge, when it isn't up to date) and ci
      # is dispatched on it: the PR gets its checks, `required` among them, from the current workflow. Its changes are
      # the changelog and the versions, so the iOS build and the push model, which run on what changed, stay skipped.
      - name: CI on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --label "autorelease: pending" --state open \
            --json number,headRefName,headRefOid --jq '.[0] // empty')
          [ -z "$pr" ] && { echo "No open release PR."; exit 0; }
          number=$(jq -r .number <<< "$pr")
          branch=$(jq -r .headRefName <<< "$pr")
          head=$(jq -r .headRefOid <<< "$pr")
          # GitHub merges main in asynchronously (202); it answers 422 when the branch is already up to date.
          if gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$number/update-branch" > /dev/null 2>&1; then
            for attempt in $(seq 1 30); do
              [ "$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" != "$head" ] && break
              sleep 2
            done
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          echo "ci dispatched on $branch (#$number)"

  # Same workflow on purpose: a release created with GITHUB_TOKEN does not trigger other workflows.
  # Two images per release: Quai Cloud (ghcr.io/…/quai) and Quai Home (ghcr.io/…/quai-home).
  image:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: cloud
            image: quai
          - target: home
            image: quai-home
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: QUAI_VERSION=${{ needs.release.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # The hosted Quai Cloud follows the releases.
  cloud:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/cloud.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  # Each release also goes to TestFlight (skipped until the App Store Connect secrets exist).
  testflight:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/testflight.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
