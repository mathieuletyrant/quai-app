# Quai, all self-hosted. Quai Cloud keeps nothing on disk: Quai Home connects to it at
# ws://<its host>:8787/home and brings the home's data. The console is Quai Home's, on :8788:
# sign in with QUAI_HOME_PASSWORD, then set the services' addresses and keys there.
services:
  quai:
    image: ghcr.io/mathieuletyrant/quai:latest
    restart: unless-stopped
    ports:
      - "8787:8787"

  quai-home:
    image: ghcr.io/mathieuletyrant/quai-home:latest
    restart: unless-stopped
    environment:
      QUAI_CLOUD_URL: ws://quai:8787/home
      # Where the iPhone reaches Quai Cloud at home: "quai" is a name only Quai Home resolves.
      QUAI_CLOUD_APP_URL: http://<this host>:8787
      QUAI_HOME_PASSWORD: change-me
    ports:
      - "8788:8788"
    volumes:
      - ./quai-home:/data
