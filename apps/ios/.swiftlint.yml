# SwiftLint (apps/ios/Tools pins the version): `scripts/lint.sh` checks, the CI's ios-client job
# runs it with `--strict`, so any violation fails. Formatting is SwiftFormat's (../.swiftformat).
# An explicit list: a SwiftLint upgrade adds no rule by surprise. None needs SourceKit or a build.
# A real exception: `// swiftlint:disable:next rule - reason`, on the line above.

only_rules:
  # Crashes: `!`, `as!`, `try!`, `Type!`, and `unowned` captures read after their owner is gone.
  - force_unwrapping
  - force_cast
  - force_try
  - implicitly_unwrapped_optional
  - unowned_variable_capture
  # Size of a decision, as the TypeScript lint does (complexity, depth, parameters).
  - cyclomatic_complexity
  - function_parameter_count
  - nesting
  - large_tuple
  # Names say what a value is: never one letter.
  - identifier_name
  - type_name
  # Dead code that can be seen without compiling.
  - unused_closure_parameter
  - unused_enumerated
  - unused_optional_binding
  - unused_setter_value
  - unused_control_flow_label
  # Likely bugs: copies, a test against itself, an observer or a thrown error lost.
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicated_key_in_dictionary_literal
  - identical_operands
  - discarded_notification_center_observer
  - unhandled_throwing_task
  - weak_delegate
  - class_delegate_protocol
  - self_in_property_initialization
  - private_swiftui_state
  # The direct form: `isEmpty`, `contains`, `first(where:)`, one way to pass closures.
  - empty_count
  - contains_over_first_not_nil
  - first_where
  - last_where
  - multiple_closures_with_trailing_closure
  # An exception must still be needed, and name its rule.
  - superfluous_disable_command
  - blanket_disable_command

excluded: [Quai/Generated, Tools, build, DerivedData]

# The most complex function today is 7; the TypeScript side stops at 15 (cognitive).
cyclomatic_complexity: {warning: 10}
# 4, as on the TypeScript side.
function_parameter_count: {warning: 4}
# A Codable type's `CodingKeys` is nested by convention.
nesting: {ignore_coding_keys: true}
# Two letters are a word (`at`, `on`, `ok`, `id`); one is never a name.
identifier_name: {min_length: 2}
type_name: {min_length: 2}
# `count == 0` on a collection, not on an `Int` named `count`.
empty_count: {only_after_dot: true}
