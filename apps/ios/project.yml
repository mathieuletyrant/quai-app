# `xcodegen generate` builds Quai.xcodeproj from this file (the project is not committed).
name: Quai
options:
  bundleIdPrefix: com.mathieuletyrant
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # iPhone only: Live Activities and the Dynamic Island are the point.
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "FFGWB5G2PN"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
# The client in Quai/Generated is generated by scripts/gen-client.sh (the generator lives in Tools/).
packages:
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.8.0
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.1.0
  swift-http-types:
    url: https://github.com/apple/swift-http-types
    from: 1.3.0
targets:
  Quai:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathieuletyrant.quai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: Quai
        excludes: [openapi.json, openapi-generator-config.yaml]
      - Shared
    info:
      path: Quai/Info.plist
      properties:
        CFBundleDisplayName: Quai
        # XcodeGen writes 1.0 (1) otherwise; the CI sets these two per release.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen: {}
        # Quai is dark only.
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The console's QR code is a quai://pair link.
        CFBundleURLTypes:
          - CFBundleURLName: com.mathieuletyrant.quai.pair
            CFBundleURLSchemes: [quai]
        # The server is often plain HTTP on the home network (umbrel.local).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Quai talks to your server on your home network.
        # No encryption beyond HTTPS: skips the export compliance question on each TestFlight build.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Quai/Quai.entitlements
      properties:
        aps-environment: development
    dependencies:
      - target: QuaiWidgets
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
      - package: swift-http-types
        product: HTTPTypes
  QuaiWidgets:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathieuletyrant.quai.widgets
        # Shared/ActivityActionIntent.swift: the widget declares the buttons, the app runs them.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
    sources:
      - QuaiWidgets
      - Shared
    info:
      path: QuaiWidgets/Info.plist
      properties:
        CFBundleDisplayName: Quai
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # With the preview server, also the screenshots: see QuaiTests/AppScreenshots.swift.
  QuaiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [QuaiTests]
    dependencies:
      - target: Quai
schemes:
  Quai:
    build:
      targets: { Quai: all }
    test:
      targets: [QuaiTests]
  # Starts the app straight on a demo Live Activity, no server needed.
  Quai Demo:
    build:
      targets: { Quai: all }
    run:
      environmentVariables:
        QUAI_DEMO_ACTIVITY: "download"
